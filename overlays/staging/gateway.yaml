apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nexora-gateway
  namespace: nexora
spec:
  gatewayClassName: istio # Powered natively by Istio / Cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexora-http-routes
  namespace: nexora
spec:
  parentRefs:
    - name: nexora-gateway
  rules:
    # 1. API Route: All /api/* traffic goes to the API Gateway
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api-gateway
          port: 8000

    # 2. Frontend Route: Default root goes to the SPA Web Portal
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-web
          port: 80