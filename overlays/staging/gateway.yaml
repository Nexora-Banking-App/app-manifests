apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nexora-gateway
  namespace: nexora
  annotations:
    # CRITICAL FIX: Tells AWS to assign public IPs and deploy to public subnets!
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexora-http-routes
  namespace: nexora
spec:
  parentRefs:
    - name: nexora-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api-gateway
          port: 8000

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-web
          port: 80