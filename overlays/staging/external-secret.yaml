apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexora-db-external-secret
  namespace: nexora
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-secret # Creates standard k8s Secret named 'db-secret'
    creationPolicy: Owner
  dataFrom:
    - extract:
        # Matches the exact secret Terraform created in AWS Secrets Manager!
        key: nexora/staging/db-credentials
---
# Static secrets for internal authentication and JWT encryption
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: nexora
type: Opaque
stringData:
  JWT_SECRET: "nexora-super-secret-key-change-in-prod"
  INTERNAL_SERVICE_SECRET: "nexora-internal-secret-key-123"