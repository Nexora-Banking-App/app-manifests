# Staging-only: connects transaction-service to Kafka. Prod is untouched until prod has its own Kafka.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
spec:
  template:
    spec:
      containers:
        - name: transaction-service
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "nexora-kafka-kafka-bootstrap.kafka.svc.cluster.local:9093"
            - name: KAFKA_SECURITY_PROTOCOL
              value: "SASL_SSL"
            - name: KAFKA_SASL_MECHANISM
              value: "SCRAM-SHA-512"
            - name: KAFKA_USERNAME
              value: "transaction-service"
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-transaction-service
                  key: KAFKA_PASSWORD
            - name: KAFKA_CA_FILE
              value: "/etc/kafka/ca/ca.crt"
          volumeMounts:
            - name: kafka-ca
              mountPath: /etc/kafka/ca
              readOnly: true
          # Kafka client libraries need more headroom than the 128Mi base limit
          resources:
            limits:
              memory: 256Mi
      volumes:
        - name: kafka-ca
          secret:
            secretName: kafka-transaction-service
            items:
              - key: ca.crt
                path: ca.crt