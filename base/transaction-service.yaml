apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  labels:
    app: transaction-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      # Prefer one replica per node so a node failure does not take out the service
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: transaction-service
      volumes:
        # Writable scratch space; the root filesystem is read-only
        - name: tmp
          emptyDir: {}
      containers:
        - name: transaction-service
          image: ghcr.io/nexora-platform/transaction-service:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: otel-env
            - secretRef:
                name: db-secret
          env:
            - name: OTEL_SERVICE_NAME
              value: transaction-service
            - name: FRAUD_SVC_URL
              value: "http://fraud-service:8000"
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: INTERNAL_SERVICE_SECRET
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              # 256Mi: the tracing SDK (and the Kafka client where used) need
              # more headroom than the previous 128Mi
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  labels:
    app: transaction-service
    # Selected by the prod ServiceMonitor (kube-prometheus-stack)
    nexora.io/metrics: enabled
spec:
  selector:
    app: transaction-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000