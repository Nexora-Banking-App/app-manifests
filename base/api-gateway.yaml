# Changed from apps/v1 Deployment to argoproj.io/v1alpha1 Rollout!
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  # THE CANARY STRATEGY:
  strategy:
    canary:
      analysis:
        templates:
          - templateName: http-error-rate
        args:
          - name: service-name
            value: api-gateway
        startingStep: 1 # Start analyzing after 10% traffic shifts!
      # No trafficRouting is configured, so weights are approximated by pod count.
      # With 2 replicas, setWeight 10 runs 1 canary pod next to 2 stable pods,
      # which is about 33% of traffic, not 10%.
      # Pauses are 2m so the analysis sees fresh 30s scrapes of the canary.
      steps:
        - setWeight: 10
        - pause: {duration: 2m}
        - setWeight: 50
        - pause: {duration: 2m}
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      # ... (KEEP THE REST OF YOUR CONTAINERS SPEC EXACTLY THE SAME!) ...
      containers:
        - name: api-gateway
          image: ghcr.io/nexora-platform/api-gateway:v1.0.0
          # CRITICAL FIX: Force Kubernetes to pull the new build from ECR!
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: AUTH_SVC_URL
              value: "http://auth-service:8000"
            - name: ACCOUNT_SVC_URL
              value: "http://account-service:8000"
            - name: TRANSACTION_SVC_URL
              value: "http://transaction-service:8000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: INTERNAL_SERVICE_SECRET
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000