apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service
  labels:
    app: fraud-service
spec:
  # No replicas field: the HorizontalPodAutoscaler below owns the replica count.
  selector:
    matchLabels:
      app: fraud-service
  template:
    metadata:
      labels:
        app: fraud-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      # Prefer one replica per node so a node failure does not take out the service
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: fraud-service
      volumes:
        # Writable scratch space; the root filesystem is read-only
        - name: tmp
          emptyDir: {}
      containers:
        - name: fraud-service
          image: ghcr.io/nexora-platform/fraud-service:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: otel-env
          env:
            - name: OTEL_SERVICE_NAME
              value: fraud-service
            # CPU work per scan, kept so the HPA demo still scales under load.
            # Set to "0" to run the rule engine alone.
            - name: FRAUD_SIMULATED_WORK_ITERATIONS
              value: "500000"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              # 256Mi: the tracing SDK (and the Kafka client where used) need
              # more headroom than the previous 128Mi
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-service
  labels:
    app: fraud-service
    # Selected by the prod ServiceMonitor (kube-prometheus-stack)
    nexora.io/metrics: enabled
spec:
  selector:
    app: fraud-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraud-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fraud-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50